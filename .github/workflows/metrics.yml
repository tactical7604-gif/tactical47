name: metrics
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths: ['metrics.js', '.github/workflows/metrics.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: metrics-${{ github.ref }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node metrics.js
      - run: |
          git config user.name metrics-bot
          git config user.email metrics-bot@users.noreply.github.com
          git add data/metrics.json
          git diff --cached --quiet || (git commit -m "metrics update" && git pull --rebase && git push)
