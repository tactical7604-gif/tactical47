name: betman
on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    paths: ['betman.js', '.github/workflows/betman.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: betman
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node betman.js
      - run: |
          git config user.name betman-bot
          git config user.email betman-bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m "betman update" && git pull --rebase && git push)
