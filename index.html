<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eff1f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1012" media="(prefers-color-scheme: dark)">
<title>축구 분석 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  /* Layout: phone column with bottom tabs (경기 · 배당 · 전술판 · 일지). A match opens one long card: summary → form → injuries → next 5 → odds (엑셀 방식) → my call → Poisson. Numbers use a condensed face. */
  --bg: #eff1f0;
  --surface: #ffffff;
  --sunken: #f5f6f5;
  --ink: #15181b;
  --muted: #5d6570;
  --line: #dde1e3;
  --accent: #2446d8;
  --accent-ink: #ffffff;
  --accent-soft: #e6ebff;
  --good: #11804d; --good-soft: #d9f2e5;
  --bad: #bf322c; --bad-soft: #fbe1df;
  --warn: #8f5500; --warn-soft: #fff0d4;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "IBM Plex Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1012; --surface: #171a1e; --sunken: #121518; --ink: #eef0f2; --muted: #9ca3ad; --line: #2a2f35;
    --accent: #7c92ff; --accent-ink: #0b0d12; --accent-soft: #1f2645;
    --good: #45c98e; --good-soft: #15301f; --bad: #ff8a84; --bad-soft: #3d1f1f; --warn: #ffc46b; --warn-soft: #3a2b12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1012; --surface: #171a1e; --sunken: #121518; --ink: #eef0f2; --muted: #9ca3ad; --line: #2a2f35;
  --accent: #7c92ff; --accent-ink: #0b0d12; --accent-soft: #1f2645;
  --good: #45c98e; --good-soft: #15301f; --bad: #ff8a84; --bad-soft: #3d1f1f; --warn: #ffc46b; --warn-soft: #3a2b12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
#app { max-width: 560px; margin: 0 auto; padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
#top { position: sticky; top: 0; z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 54px; padding: 8px 16px; }
#top h1 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.back { border: 0; background: none; display: inline-flex; align-items: center; gap: 2px; font-weight: 600; font-size: 15px; padding: 8px 6px 8px 0; min-width: 0; }
.back svg { width: 22px; height: 22px; flex: none; }
.back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.demo { flex: none; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
main { padding: 0 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.banner { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.card h3 { font-size: 15.5px; font-weight: 700; }
.sub { font-size: 12.5px; color: var(--muted); }
.muted { color: var(--muted); }
.src { font-size: 11.5px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.src::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.src.man::before { background: var(--warn); }
.src.calc::before { background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; display: inline-flex; align-items: center; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tag { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.plain { background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
.pos { color: var(--good); } .neg { color: var(--bad); }
.btn { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { min-height: 34px; font-size: 13px; padding: 0 10px; border-radius: 9px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 13px; padding: 4px 0; }

/* fixture list */
.day { font-size: 13px; font-weight: 700; color: var(--muted); padding: 4px 2px 0; }
.fx { width: 100%; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.fx-time { font: 600 19px var(--font-num); white-space: nowrap; }
.fx-teams { display: grid; gap: 1px; min-width: 0; }
.fx-teams > span { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rk { font: 500 12.5px var(--font-num); color: var(--muted); font-style: normal; margin-left: 4px; }
.fx-odds { font: 600 14px var(--font-num) !important; color: var(--muted); }
.fx-side { display: grid; justify-items: end; gap: 4px; }

/* match */
.mh { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; text-align: center; gap: 6px; }
.mh .tn { font-size: 19px; font-weight: 700; line-height: 1.25; }
.mh .vs { font: 600 15px var(--font-num); color: var(--muted); }
.mh-meta { text-align: center; font-size: 12.5px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.kpi { background: var(--sunken); border-radius: 10px; padding: 8px 9px; display: grid; min-width: 0; }
.kpi b { font: 700 18px/1.2 var(--font-num); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi span { font-size: 11.5px; color: var(--muted); }
.form { display: flex; gap: 4px; flex-wrap: wrap; }
.r { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 4px; border-radius: 6px; font-size: 12.5px; font-weight: 700; }
.r.W { background: var(--good-soft); color: var(--good); }
.r.D { background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
.r.L { background: var(--bad-soft); color: var(--bad); }
.team-block { display: grid; gap: 6px; }
.team-block + .team-block { border-top: 1px solid var(--line); padding-top: 10px; }
.tb-name { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 700; }
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.list li:first-child { border-top: 0; }
.n5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.n5 div { border-radius: 8px; padding: 6px 2px; text-align: center; font-size: 11.5px; line-height: 1.35; overflow: hidden; }
.n5 .hard { background: var(--bad-soft); color: var(--bad); }
.n5 .easy { background: var(--good-soft); color: var(--good); }
.n5 .mid { background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
.n5 .ucl { background: var(--warn-soft); color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

/* odds */
.oin { display: grid; grid-template-columns: 62px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; }
.oin .lab { font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.25; }
.oin .hd { text-align: center; font-size: 12px; color: var(--muted); font-weight: 700; }
.oin input { width: 100%; min-width: 0; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunken); text-align: center; font: 700 21px var(--font-num); padding: 0; }
.oin input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.pay { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pay div { background: var(--sunken); border-radius: 10px; padding: 8px 10px; }
.pay div { min-width: 0; }
.pay b { display: block; font: 700 22px/1.15 var(--font-num); white-space: nowrap; }
.pay b small { font-size: 14px; margin-left: 1px; }
.pay span { font-size: 11.5px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 7px 4px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; white-space: normal; }
.tbl thead th { border-top: 0; font-size: 12px; color: var(--muted); font-weight: 700; }
.tbl td.n { font: 600 16px var(--font-num); }
.tbl tr.hl td { background: var(--accent-soft); }
.callout { border-radius: 10px; padding: 10px 12px; background: var(--accent-soft); font-size: 13.5px; }
.callout.good { background: var(--good-soft); }
.callout.warn { background: var(--warn-soft); }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 92px; gap: 8px; align-items: center; font-size: 12.5px; }
.bar { position: relative; height: 18px; }
.bar i { position: absolute; left: 0; height: 8px; border-radius: 4px; }
.bar i.m { top: 0; background: var(--accent); }
.bar i.k { bottom: 0; background: var(--muted); opacity: .55; }
.bar-v { text-align: right; font: 600 13.5px var(--font-num); white-space: nowrap; }
.scores { display: flex; flex-wrap: wrap; gap: 6px; }
.scores span { padding: 4px 10px; border-radius: 8px; background: var(--sunken); border: 1px solid var(--line); font: 600 15px var(--font-num); }
.scores small { font: 500 12px var(--font-ui); color: var(--muted); margin-left: 4px; }
.mine { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.mine label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; }
.mine input { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunken); text-align: center; font: 700 20px var(--font-num); width: 100%; min-width: 0; }
.mine input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.combo-row { display: grid; grid-template-columns: minmax(0, 1fr) 84px 36px; gap: 6px; }
.combo-row input { height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunken); padding: 0 10px; min-width: 0; }
.combo-row input.k { text-align: center; font: 700 19px var(--font-num); padding: 0; }
.combo-row button { border: 0; background: var(--sunken); border-radius: 10px; color: var(--muted); }
.big { font: 700 34px/1 var(--font-num); }
.grid-wrap { overflow: auto; max-height: 360px; border: 1px solid var(--line); border-radius: 10px; }
.grid { border-collapse: collapse; font: 500 13px var(--font-num); }
.grid th, .grid td { padding: 4px 7px; border: 1px solid var(--line); text-align: center; }
.grid th { background: var(--sunken); position: sticky; top: 0; }
.grid tbody th { position: sticky; left: 0; }
.grid td.hi { background: var(--accent-soft); font-weight: 700; }
details summary { cursor: pointer; font-weight: 700; font-size: 15px; }
details[open] summary { margin-bottom: 10px; }
.field { display: grid; gap: 5px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.field input { height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunken); padding: 0 10px; font-size: 16px; color: var(--ink); }

/* journal */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; display: grid; gap: 2px; }
.tile b { font: 700 27px/1.1 var(--font-num); }
.tile span { font-size: 12px; color: var(--muted); }
.meter { height: 8px; border-radius: 4px; background: var(--sunken); overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter.over i { background: var(--bad); }
.entry { width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: none; }
.entry:first-child { border-top: 0; }
.entry .p { font-size: 13.5px; font-weight: 600; }
.entry .m { font-size: 12px; color: var(--muted); }
.entry .rt { display: grid; justify-items: end; align-content: center; gap: 3px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font: 600 11px var(--font-ui); fill: var(--muted); }

/* tactics board */
.tb-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tb-row button { min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; }
.tb-tool.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 700; }
.tb-sel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tb-sel label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.tb-sel select { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; }
#tb { display: block; width: 100%; max-width: 340px; margin: 0 auto; border-radius: 10px; -webkit-user-select: none; user-select: none; }
#tb .pl, #tb-ball { transition: transform .6s ease; cursor: grab; }
#tb .drag { transition: none; cursor: grabbing; }
#tb-cap { min-height: 40px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; color: var(--muted); }

/* nav, sheets, toast */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
#tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
#tabs button { border: 0; background: none; height: 62px; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 11.5px; color: var(--muted); }
#tabs svg { width: 23px; height: 23px; }
#tabs button.on { color: var(--accent); font-weight: 700; }
.scrim { position: fixed; inset: 0; z-index: 40; background: rgb(8 10 16 / .45); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; max-height: 90vh; max-height: 90dvh; display: flex; flex-direction: column; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgb(0 0 0 / .2); }
.sheet::before { content: ""; flex: none; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 2px; }
.sh-head { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 16px 10px; }
.sh-head h2 { font-size: 19px; font-weight: 700; }
.sh-body { flex: 1 1 auto; overflow-y: auto; padding: 2px 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; }
.sh-foot { flex: none; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.x { width: 38px; height: 38px; border: 0; border-radius: 10px; background: var(--sunken); font-size: 20px; line-height: 1; }
#toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 70; transform: translate(-50%, 12px); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

.top-r { display: flex; align-items: center; gap: 6px; flex: none; }
.icon-btn { width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.err { border-radius: 10px; padding: 10px 12px; background: var(--bad-soft); color: var(--bad); font-size: 13.5px; word-break: break-word; }
.loading { color: var(--muted); font-size: 13.5px; }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 14px; }
textarea.ta { width: 100%; min-height: 90px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunken); padding: 10px; font-size: 13px; resize: vertical; }
.field input[type=password], .field input.key { font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
.okline { font-size: 13px; color: var(--good); font-weight: 600; }
.badline { font-size: 13px; color: var(--bad); font-weight: 600; word-break: break-word; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.hr { height: 1px; background: var(--line); margin: 2px 0; }
/* Netlify puts a "Powered by Netlify" badge (an iframe) in the bottom-right corner of new free projects; it covers the tab bar */
iframe#nl-badge-frame, #nl-badge, [id^="nl-badge"] { display: none !important; visibility: hidden !important; pointer-events: none !important; }
/* tactics board tools: 4 x 2 grid, then colour and size for 선·펜·글씨 */
.tb-tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tb-tools .tb-tool { min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; justify-items: center; align-content: center; gap: 2px; padding: 4px 2px; font-size: 12px; color: var(--ink); }
.tb-tools .tb-tool svg { width: 18px; height: 18px; }
.tb-style { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px; border-radius: 12px; background: var(--sunken); border: 1px solid var(--line); }
.tb-style .chip { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); padding: 0; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .15); }
.sw.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
#tb.drawing { touch-action: none; }
.mini-h { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.bench { display: flex; flex-wrap: wrap; gap: 6px; }
.bp { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line); white-space: nowrap; }
.bp b { margin-right: 2px; }
.bp.in { border-color: var(--good); }
.bp em { color: var(--good); font-style: normal; font-weight: 700; }

/* live score */
.tag.live { background: var(--bad-soft); color: var(--bad); gap: 5px; }
.tag.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.fx-score { font: 700 22px/1 var(--font-num); white-space: nowrap; }
.fx-goals { font-size: 12px; color: var(--muted); white-space: normal; line-height: 1.4; }
.fx-goals i { font-style: normal; opacity: .75; }

<script>'use strict';
/* 축구 분석 노트 — installable app.
   Data: ESPN public site API (no key) for fixtures, table, form, odds and schedules; Open-Meteo for kickoff weather.
   Everything the user types (Betman odds, own probabilities, journal, notes, board) lives in IndexedDB on the phone. */

/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
const f2 = n => (Math.round(n * 100) / 100).toFixed(2);
const pct = (n, d = 1) => (n * 100).toFixed(d) + '%';
const sgn = (n, d = 1) => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(d);
const won = n => (n < 0 ? '−' : '') + Math.round(Math.abs(n)).toLocaleString('ko-KR') + '원';
const toNum = v => { if (v == null || String(v).trim() === '') return null; const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
const argmax = a => a.indexOf(Math.max(...a));
const OUT = ['승', '무', '패'];
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };

/* ================= odds math (the spreadsheet, row by row) ================= */
/* 환급률 = 1/Σ(1/배당) · 경기확률 = 환급률/배당 · 적정배당 = 해외배당 × 베트맨 환급률 ÷ 해외 환급률
   배당편차 = 베트맨 − 해외 · 절삭률 = (베트맨 − 기준)/(기준 − 1) × 100 */
function analyze(K, O) {
  const ok3 = a => Array.isArray(a) && a.length === 3 && a.every(x => x != null && x > 1);
  const r = { okK: ok3(K), okO: ok3(O) };
  if (r.okK) { r.payK = 1 / K.reduce((s, k) => s + 1 / k, 0); r.probK = K.map(k => r.payK / k); }
  if (r.okO) { r.payO = 1 / O.reduce((s, o) => s + 1 / o, 0); r.probO = O.map(o => r.payO / o); }
  r.ok = r.okK && r.okO;
  if (r.ok) {
    r.fair = O.map(o => o * r.payK / r.payO);
    r.dev = K.map((k, i) => k - O[i]);
    r.cutKO = K.map((k, i) => (k - O[i]) / (O[i] - 1) * 100);
    r.cutKF = K.map((k, i) => (k - r.fair[i]) / (r.fair[i] - 1) * 100);
    r.evO = K.map((k, i) => r.probO[i] * k - 1);
  }
  return r;
}
/* odds come as American (+300 / -140), fractional (7/10) or decimal (2.10) */
function anyToDec(v) {
  if (v == null) return null;
  if (typeof v === 'number') return Math.abs(v) >= 100 ? amToDec(v) : (v > 1 ? v : null);
  const s = String(v).trim().toUpperCase();
  if (!s) return null;
  if (s === 'EVEN' || s === 'EVS' || s === 'EVENS' || s === 'EV') return 2;
  const fr = s.match(/^(\d+)\s*\/\s*(\d+)$/);
  if (fr) return +fr[2] ? 1 + (+fr[1]) / (+fr[2]) : null;
  if (/^[+-]\d{3,}$/.test(s)) return amToDec(+s);
  const n = parseFloat(s);
  if (!Number.isFinite(n)) return null;
  return Math.abs(n) >= 100 ? amToDec(n) : (n > 1 ? n : null);
}
function amToDec(a) { return a > 0 ? 1 + a / 100 : a < 0 ? 1 + 100 / -a : null; }
function oddsTriplet(o) {
  if (!o || typeof o !== 'object') return null;
  const tries = [
    () => [o.homeTeamOdds && o.homeTeamOdds.moneyLine, o.drawOdds && o.drawOdds.moneyLine, o.awayTeamOdds && o.awayTeamOdds.moneyLine],
    () => { const m = o.moneyline || {}; const g = x => x && ((x.close && x.close.odds) || (x.open && x.open.odds)); return [g(m.home), g(m.draw), g(m.away)]; },
    () => { const b = o.bettingOdds || {}; const g = x => x && ((x.odds && (x.odds.summary || x.odds.value)) || x.summary || x.value); return [g(b.homeTeamOdds), g(b.drawOdds || b.tieOdds), g(b.awayTeamOdds)]; },
    () => { const b = (o.bettingOdds && o.bettingOdds.teamOdds) || {}; const g = x => x && (x.value || x.summary || (x.odds && x.odds.summary)); return [g(b.preMatchMoneyLineHome || b.moneyLineHome), g(b.preMatchMoneyLineDraw || b.moneyLineDraw), g(b.preMatchMoneyLineAway || b.moneyLineAway)]; }
  ];
  for (const t of tries) {
    let raw; try { raw = t(); } catch (e) { continue; }
    const dec = raw.map(anyToDec);
    if (dec.every(x => x != null && x > 1 && x < 200)) return dec.map(x => +x.toFixed(2));
  }
  return null;
}
function parseOddsList(list) {
  const rows = [], seen = new Set();
  (Array.isArray(list) ? list : []).forEach(o => {
    const name = (o && o.provider && o.provider.name) || '해외';
    if (seen.has(name)) return;
    const t = oddsTriplet(o);
    if (t) { seen.add(name); rows.push({ name, t }); }
  });
  if (!rows.length) return null;
  const O = [0, 1, 2].map(i => +(rows.reduce((s, r) => s + r.t[i], 0) / rows.length).toFixed(2));
  return { O, by: rows.map(r => r.name) };
}

const DB = {
  db: null, ok: false, mem: new Map(),
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('football-notes', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      this.mem = await new Promise((res, rej) => {
        const out = new Map(), c = this.db.transaction('kv').objectStore('kv').openCursor();
        c.onsuccess = () => { const cur = c.result; if (cur) { out.set(cur.key, cur.value); cur.continue(); } else res(out); };
        c.onerror = () => rej(c.error);
      });
      this.ok = true;
    } catch (e) { this.ok = false; }
  },
  get(k, d) { return this.mem.has(k) ? this.mem.get(k) : d; },
  set(k, v) { this.mem.set(k, v); if (!this.ok) return; try { this.db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) { } },
  del(k) { this.mem.delete(k); if (!this.ok) return; try { this.db.transaction('kv', 'readwrite').objectStore('kv').delete(k); } catch (e) { } },
  keys() { return Array.from(this.mem.keys()); }

/* ================= network + cache ================= */
const inflight = new Map();
async function fetchJSON(url) {
  let res;
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const tm = ctl ? setTimeout(() => ctl.abort(), 15000) : 0;
  try { res = await fetch(url, ctl ? { signal: ctl.signal } : {}); }
  catch (e) { throw new Error(navigator.onLine === false ? '인터넷이 꺼져 있어요' : (e && e.name === 'AbortError') ? '응답이 너무 늦어요' : '자료를 못 받았어요 (연결 문제)'); }
  finally { if (tm) clearTimeout(tm); }
  if (!res.ok) throw new Error('자료를 못 받았어요 (서버 ' + res.status + ')');
  try { return await res.json(); } catch (e) { throw new Error('자료 형식이 이상해요'); }
}
/* caches what the app extracts (small), not the raw answer */
async function cached(key, ttlH, force, fn) {
  const hit = DB.get('c:' + key);
  if (hit && !force && Date.now() - hit.t < ttlH * 36e5) return hit.v;
  if (inflight.has(key)) return inflight.get(key);
  const p = (async () => {
    try { const v = await fn(); DB.set('c:' + key, { t: Date.now(), v }); return v; }
    catch (e) { if (hit) { S.stale = true; return hit.v; } throw e; }
  })();
  inflight.set(key, p);
  try { return await p; } finally { inflight.delete(key); }
}
async function poolMap(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k]); } }));
  return out;
}

async function loadFixtures(lg, force) {
  const today = todayStr();
  const prev = DB.get('c:fx2:' + lg + ':' + today);
  const anyLive = prev && Array.isArray(prev.v) && prev.v.some(liveWindow);
  const soon = prev && Array.isArray(prev.v) && prev.v.some(f => !f.done && f.state === 'pre' && f.ts > Date.now() && f.ts - Date.now() < 3 * 36e5);
  return cached('fx2:' + lg + ':' + today, anyLive ? 1 / 60 : soon ? 0.25 : 3, force, async () => {
    const days = Array.from({ length: 19 }, (_, i) => addDays(today, i - 1).replace(/-/g, ''));
    let list;
    try {
      const j = await fetchJSON(`${SITE}${lg}/scoreboard?dates=${days[0]}-${days[days.length - 1]}&limit=300`);
      list = (j.events || []).map(e => mapEvent(e, lg));
    } catch (e) {
      let lastErr = e;
      const res = await poolMap(days, 4, d => fetchJSON(`${SITE}${lg}/scoreboard?dates=${d}`).then(j => (j.events || []).map(ev => mapEvent(ev, lg))).catch(err => { lastErr = err; return null; }));
      if (res.every(r => r === null)) throw lastErr;
      list = res.filter(Boolean).flat();
    }
    const seen = new Set();
    return list.filter(f => f.id && !seen.has(f.id) && seen.add(f.id)).sort((a, b) => a.ts - b.ts);
  });
}

function pickClv(p) {

    const [x, y] = evXY(e), w = 1 - (tNow - e[5]) / 600 * 0.7, o = by.get(e[1]) || { x: 0, y: 0, w: 0, n: 0 };
    o.x += x * w; o.y += y * w; o.w += w; o.n++; by.set(e[1], o);

/* who stands in each slot at a given second: starters, then the substitutes in the order they came on */

      const below = vals.filter(x => (dir === -1 ? x > v : x < v)).length, eq = vals.filter(x => x === v).length;
      const pct = vals.length ? Math.round(((below + eq * 0.5) / vals.length) * 100) : null;
      return { label, v, pct };
    });
    const n = others.length + 1, ok = others.length >= 2;
    cmp = `<div class="pf-card"><p class="sub">오늘 경기 양 팀 ${GROUP_KO[g]} ${n}명 중 · ${Math.round(min)}분 출전</p>
      ${ok ? radarSVG(rows.map(r => r.pct || 0), rows.map(r => r.label)) : '<p class="sub">비교할 선수가 부족해서 숫자만 보여줘요.</p>'}
      <div class="pf-tbl"><div class="th"><span>지표</span><span>값</span><span>백분위</span></div>
      ${rows.map(r => `<div><span>${esc(r.label)}</span><span class="num">${f2(r.v)}<small>/90</small></span><span class="pctc">${r.pct == null ? '-' : `<i class="bar"><i style="width:${r.pct}%"></i></i><b class="num">${r.pct}</b>`}</span></div>`).join('')}</div>
      <p class="sub">백분위 = 비교한 선수 중 이 선수보다 낮은 비율 (90분 이상 뛴 선수만)</p></div>`;
  }

  /* 2) headline tile: xG instead of a rating (ratings aren't in free data) */
  const xg = sum('expectedGoals'), xa = sum('expectedAssists');
  const isGK = g === 'gk';
  const tile = `<div class="pf-card pf-tile"><div class="big"><b class="num">${isGK ? (SS.saves || 0) : haveG ? f2(xg) : '…'}</b><span>${isGK ? '선방' : '기대 득점 (xG)'}</span></div>
    <div class="rows"><div><span>출전</span><b class="num">${app}</b></div>${isGK ? `<div><span>실점</span><b class="num">${SS.goalsConceded || 0}</b></div><div><span>클린시트</span><b class="num">${SS.cleanSheet || 0}</b></div>`
      : `<div><span>득점</span><b class="num">${SS.totalGoals || 0}</b></div><div><span>도움</span><b class="num">${SS.goalAssists || 0}</b></div><div><span>기대 도움 (xA)</span><b class="num">${haveG ? f2(xa) : '…'}</b></div>`}</div></div>`;

  /* 3) season record */
  const per = (v, d) => (d > 0 ? v / d : 0);
  const recRows = isGK
    ? [['선발', `${SS.starts || 0}<small>회</small>`], ['경기당 출전 시간', `${Math.round(per(min, app))}<small>분</small>`], ['90분당 실점', f2(per(SS.goalsConceded || 0, min) * 90)], ['펀칭', `${SS.punches || 0}<small>회</small>`], ['크로스 처리', `${SS.crossesCaught || 0}<small>회</small>`], ['옐로 / 레드', `${SS.yellowCards || 0} / ${SS.redCards || 0}`]]
    : [['선발', `${SS.starts || 0}<small>회</small>`], ['경기당 출전 시간', `${Math.round(per(min, app))}<small>분</small>`], ['90분당 득점', f2(per(SS.totalGoals || 0, min) * 90)], ['빅찬스 놓침', `${SS.bigChanceMissed || 0}<small>회</small>`],
      ['공중볼 경합 승', haveG ? `${sum('aerialsWon')}<small>회</small>` : '…'], ['키패스 (경기당)', f1(per(SS.shotAssists || 0, app))], ['피파울 (경기당)', f1(per(SS.foulsSuffered || 0, app))], ['옐로 / 레드', `${SS.yellowCards || 0} / ${SS.redCards || 0}`]];
  const rec = `<div class="pf-card pf-rows">${recRows.map(([k, v]) => `<div><span>${k}</span><b class="num acc">${v}</b></div>`).join('')}</div>`;

  /* 4) success rates */
  const dW = sum('wonContest'), dT = sum('totalContest');
  const rates = (isGK ? [['선방률', SS.saves || 0, (SS.saves || 0) + (SS.goalsConceded || 0)], ['패스 성공률', Math.round((SS.passPct || 0) * 1000), 1000]]
    : [['슈팅 정확도', SS.shotsOnTarget || 0, SS.totalShots || 0], ['경합 승률', SS.duelsWon || 0, SS.duels || 0], haveG ? ['드리블 성공률', dW, dT] : null, ['크로스 성공률', SS.accurateCrosses || 0, SS.totalCrosses || 0], ['패스 성공률', Math.round((SS.passPct || 0) * 1000), 1000]]).filter(Boolean);
  const rate = `<div class="pf-card pf-rates">${rates.map(([k, a, b]) => `<div><div class="rt"><span>${k}${b !== 1000 ? ` <small class="num">${a} / ${b}</small>` : ''}</span><b class="num">${pc(a, b)}%</b></div><i class="bar"><i style="width:${pc(a, b)}%"></i></i></div>`).join('')}</div>`;

  /* 5) shot split */
  const on = SS.shotsOnTarget || 0, off = SS.shotsOffTarget || 0, blk = Math.max(0, (SS.totalShots || 0) - on - off);
  const shots = isGK ? '' : `<p class="pf-h">슈팅 분포</p><div class="pf-card pf-shots">${donutSVG([[on, '#22c55e'], [off, '#64748b'], [blk, '#f97316']])}
    <div class="lg"><span><i style="background:#22c55e"></i>유효 슈팅 ${on}</span><span><i style="background:#64748b"></i>빗나감 ${off}</span><span><i style="background:#f97316"></i>막힘 ${blk}</span></div></div>`;

  return `<p class="pf-h">${esc(seasonLabel(P.lg))}</p><p class="pf-h sm">같은 포지션과 비교</p>${cmp}${tile}
    <p class="pf-h">시즌 기록</p>${rec}<p class="pf-h">성공률</p>${rate}${shots}
    ${haveG ? '' : `<p class="sub" style="text-align:center">${P.gamesSt === 'err' ? '경기별 기록을 못 받아서 xG·드리블은 빠졌어요' : '경기별 기록(xG·드리블) 불러오는 중…'}</p>`}`;
}

/* --- line-up onto the board --- */
/* mode 'live' (새로고침): keep where everyone stands, only bring in substitutes and the bench; otherwise lay the line-up out fresh */
function fetchLineupToBoard(fx, force, manual, mode) {
  busy(1);
  let redraw = true;
  loadLineup(fx, force).then(lu => {
    S.luState = '';
    if (lu && lu.ok) {
      if ((mode === 'live' || mode === 'auto') && TB.lu && TB.lu.ok && TB.lu.fid === fx.id) {
        redraw = liveLineup(lu); saveBoard();
        if (manual) toast('점수·교체를 새로 받았어요');
      } else { setBoardMatch(fx, lu); if (manual) toast('선발 라인업을 깔았어요'); }
    } else if (manual) toast('아직 라인업이 안 나왔어요');
  }, e => { S.luState = 'err'; S.luErr = e.message; if (mode === 'auto') redraw = false; }).finally(() => {
    busy(-1);
    if (S.view !== 'board' || $('#sheets').innerHTML) return;
    /* score and bench update in place; the pitch is redrawn only when players changed and no finger is on it */
    const lv = $('#bd-live'), bb = $('#bd-bench');
    if (lv) lv.innerHTML = liveBlock();
    if (bb) bb.innerHTML = benchCard();
    if (redraw && !TB.busy) render();
    const sc = TB.lu && TB.lu.score;
    if (TB.lu && TB.lu.ok && TB.lu.fid === fx.id && sc && (sc.state === 'in' || sc.done || sc.state === 'post')) loadMatchStats(fx, !!force);
  });
}
/* team stats every refresh; the shot list only when the shot count moved (it is the big download) */
async function loadMatchStats(fx, force) {
  const lu = TB.lu; if (!lu || !lu.hid || !lu.aid) return;
  const prev = S.ms && S.ms.fid === fx.id ? S.ms : null;
  const ms = { fid: fx.id, h: prev && prev.h, a: prev && prev.a, shots: prev ? prev.shots : null, at: prev && prev.at, err: '', shotErr: '' };
  try {
    const [h, a] = await Promise.all([loadTeamStats(fx, lu.hid, force), loadTeamStats(fx, lu.aid, force)]);
    const moved = !prev || !prev.h || (h.totalShots || 0) + (a.totalShots || 0) !== (prev.h.totalShots || 0) + (prev.a.totalShots || 0);
    ms.h = h; ms.a = a; ms.at = Date.now();
    ms.ev = prev && prev.ev;
    const live = !!(TB.lu.score && TB.lu.score.state === 'in');
    try { if (moved || !ms.shots || !ms.ev || live) { const r = await loadShots(fx, force || moved); ms.shots = r.shots; ms.ev = r.ev; } } catch (e) { ms.shotErr = e.message; ms.shots = ms.shots || []; ms.ev = ms.ev || []; }
  } catch (e) { ms.err = e.message; }
  S.ms = ms;
  if (S.view === 'board' && TB.lu && TB.lu.fid === fx.id) {
    const el = $('#bd-stats'); if (el) el.innerHTML = statsCard();
    const av = $('#bd-avg'); if (av && !($('#flow') && $('#fl-play').textContent.includes('멈춤'))) { av.innerHTML = avgBody(); mountFlow(); }
    if (applyLive()) { saveBoard(); if (TB.redraw && !TB.busy) TB.redraw(true); }
  }
}

function clvLine(p) {

        <div class="btns"><button type="button" class="btn sm" data-act="imp-file">백업 파일 고르기</button></div>
        <textarea class="ta" id="imp-text" placeholder="복사해 둔 백업 글을 여기 붙여넣기"></textarea>
        <button type="button" class="btn sm" data-act="imp-paste" style="justify-self:start">붙여넣은 걸로 불러오기</button></div>
      <div class="hr"></div>
      <label class="field">베트맨 경기당 환급률 (%)<input inputmode="decimal" id="set-pay" value="${esc(S.set.pay)}"></label>
      <label class="field">한 달 한도 (원)<input inputmode="numeric" id="set-limit" value="${esc(S.set.limit)}"></label>
      <div class="hr"></div>
      <p class="sub">자료 출처: 경기·순위·최근 경기·해외 배당은 ESPN 공개 데이터(가입 필요 없음), 날씨는 Open-Meteo. 받아온 자료는 폰에 잠깐 저장해 두고 인터넷이 없을 때 보여줘요.</p>
      <button type="button" class="btn sm" data-act="clear-cache" style="justify-self:start">받아온 자료 비우기</button>
      <p class="sub">${DB.ok ? '저장소 정상' : '이 브라우저에선 저장이 안 돼요. 크롬에서 열어 주세요.'} · 버전 a13baf8e</p>
    </div>`);
}

/* ================= events ================= */
/* remember which folding parts of the live card are open, so the 1-minute refresh doesn't close them */
document.addEventListener('toggle', e => { const d = e.target; if (d && d.matches && d.matches('details[data-k]')) { S.msOpen = S.msOpen || {}; S.msOpen[d.dataset.k] = d.open; } }, true);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'tab': {
      const to = el.dataset.tab, above = S.view === 'match' || tabPushed;
      if (to === S.view) { window.scrollTo(0, 0); break; }
      if (S.view === 'matches') S.listY = window.scrollY;
      if (to === 'matches') { if (above) popThen(1); tabPushed = false; }
      else { if (above) history.replaceState({ tab: 1 }, ''); else history.pushState({ tab: 1 }, ''); tabPushed = true; }
      S.view = to; render(); window.scrollTo(0, to === 'matches' ? (S.listY || 0) : 0); break;
    }
    case 'open': openMatch(el.dataset.id); break;
    case 'back': history.back(); break;
    case 'refresh':
      if (S.view === 'match') { const fx = fxById(S.fid); if (fx) loadDetail(fx, true); }
      else if (S.view === 'board') { const fx = boardFx(); if (fx) fetchLineupToBoard(fx, true, true, 'live'); }
      else { loadList(true); if (S.lt === 'past') loadPast(true); }
      break;
    case 'retry': { const fx = fxById(el.dataset.id); if (fx) loadDetail(fx, true); break; }
    case 'league': if (el.dataset.l !== S.lg) { S.lg = el.dataset.l; S.set.lg = S.lg; saveSet(); S.fixtures = []; S.table = null; S.past = []; S.pastDays = PAST_STEP; S.pastState = 'idle'; loadList(false); if (S.lt === 'past') loadPast(false); } break;
    case 'lt': {
      const v = el.dataset.v === 'past' ? 'past' : 'up';
      if (v === S.lt) break;
      S.lt = v; render(); window.scrollTo(0, 0);
      if (v === 'past' && (S.pastLg !== S.lg || S.pastState === 'idle' || S.pastState === 'err')) loadPast(false);
      break;
    }
    case 'round-open': { S.rOpen = S.rOpen || {}; S.rOpen[el.dataset.k] = !S.rOpen[el.dataset.k]; render(); break; }
    case 'past-more': if (S.pastDays < PAST_MAX && S.pastState !== 'loading') { S.pastDays = Math.min(PAST_MAX, S.pastDays + PAST_STEP); loadPast(false); } break;
    case 'past-retry': loadPast(false); break;
    case 'settings': settingsSheet(); break;
    case 'open-board': {
      const fx = fxById(el.dataset.id); if (!fx) break;
      const same = TB.lu && TB.lu.fid === fx.id;
      if (!same) setBoardMatch(fx, null);
      history.replaceState({ tab: 1 }, ''); tabPushed = true;
      S.view = 'board';
      if (same && TB.lu.ok) { S.luState = ''; render(); window.scrollTo(0, 0); fetchLineupToBoard(fx, false, false, 'auto'); break; }
      S.luState = 'loading'; render(); window.scrollTo(0, 0);
      fetchLineupToBoard(fx, false);
      break;
    }
    case 'lu-reload': {
      const fx = boardFx(); if (!fx) break;
      S.luState = 'loading'; render();
      fetchLineupToBoard(fx, true, true);
      break;
    }
    case 'tx-color': if (S.sh) { S.sh.c = el.dataset.c; $$('[data-act="tx-color"]').forEach(b => b.classList.toggle('on', b === el)); } break;
    case 'tx-size': if (S.sh) { S.sh.fs = el.dataset.v; $$('[data-act="tx-size"]').forEach(b => b.classList.toggle('on', b === el)); } break;
    case 'tx-save': {
      const sh = S.sh || {}, txt = ($('#tx-s') ? $('#tx-s').value : '').trim().slice(0, 40);
      if (sh.idx >= 0) { const d = TB.drawings[sh.idx]; if (d) { if (txt) Object.assign(d, { s: txt, c: sh.c, fs: sh.fs }); else TB.drawings.splice(sh.idx, 1); } }
      else if (txt) TB.drawings.push({ t: 'text', x: sh.x, y: sh.y, s: txt, c: sh.c, fs: sh.fs });
      TB.color = sh.c || TB.color; TB.size = sh.fs || TB.size;
      TB.memoOpen = -1; tbRecord(sh.pre); saveBoard(); closeSheet(); render();
      break;
    }
    case 'tx-del': { const sh = S.sh || {}; if (sh.idx >= 0) TB.drawings.splice(sh.idx, 1); TB.memoOpen = -1; tbRecord(sh.pre); saveBoard(); closeSheet(); render(); break; }
    case 'bd-tab': S.bdTab = el.dataset.v; render(); break;
    case 'avg-per': { S.avgPer = el.dataset.v; const av = $('#bd-avg'); if (av) { av.innerHTML = avgBody(); mountFlow(); } break; }
    case 'live-mv': {
      TB.liveMv = !TB.liveMv;
      if (!TB.liveMv && TB.realHome && TB.realAway) { TB.home.forEach((p, i) => { const b = TB.realHome[i]; if (b) { p.x = b.x; p.y = b.y; } }); TB.away.forEach((p, i) => { const b = TB.realAway[i]; if (b) { p.x = b.x; p.y = b.y; } }); TB.trails = []; }
      saveBoard(); render(); break;
    }
    case 'pf-tab': {
      if (!S.pf) break;
      S.pf.tab = el.dataset.v;
      if ((S.pf.tab === 'games' || S.pf.tab === 'stats') && S.pf.gamesSt === 'idle') pfLoad('games');
      if (S.pf.tab === 'stats' && S.pf.cmpSt === 'idle') pfLoad('cmp');
      pfPaint(true); break;
    }
    case 'pf-retry': if (S.pf) { pfLoad(el.dataset.k, true); pfPaint(); } break;
    case 'pf-edit': if (S.pf && S.pf.team && S.pf.i >= 0) editPlayer(S.pf.team, S.pf.i); break;
    case 'pf-open': openProfile({ id: el.dataset.id, side: el.dataset.s }); break;
    case 'shot-tap': {
      /* finger position → map units, then the nearest dot */
      const m = el.getScreenCTM && el.getScreenCTM(); if (!m || !el.createSVGPoint) break;
      const pt = el.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(m.inverse());
      pickShot(p.x, p.y); break;
    }
    case 'shot-sel': {
      const id = el.dataset.id;
      S.shotSel = S.shotSel === id ? null : id; S.shotNear = null;
      const box = $('#shot-box');
      if (box) { box.innerHTML = shotBoxHTML(); if (S.shotSel) box.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      markShotList(); break;
    }
    case 'ms-retry': { const fx = boardFx(); if (fx) { S.ms = null; const el = $('#bd-stats'); if (el) el.innerHTML = statsCard(); loadMatchStats(fx, true); } break; }
    case 'lu-clear': clearBoardNames(); S.luState = ''; render(); toast('이름을 지웠어요'); break;
    case 'pl-save': {
      const sh = S.sh || {}, p = TB[sh.team] && TB[sh.team][sh.i];
      if (p) { const j = $('#pl-j').value.trim().slice(0, 3), nm = $('#pl-nm').value.trim().slice(0, 16); p.j = j || String(p.n); p.nm = nm; saveBoard(); }
      closeSheet(); render();
      break;
    }
    case 'odds-auto': { const b = getBet(el.dataset.id); b.O = null; setBet(el.dataset.id, b); const fx = fxById(el.dataset.id); if (fx) { const O = effO(fx); $$(`[data-o="${fx.id}"][data-side="O"]`).forEach((inp, i) => { inp.value = O ? f2(O[i]) : ''; }); $('#out-' + fx.id).innerHTML = oddsOut(b.K, O); $('#o-src').innerHTML = oSrcLabel(fx); $('#mine-out').innerHTML = mineOut(fx.id); } break; }
    case 'log-pick': {
      const fx = fxById(el.dataset.id); if (!fx) break;
      const i = +el.dataset.i, K = getBet(fx.id).K, P = getMine(fx);
      const best = i >= 0 ? i : argmax([0, 1, 2].map(j => (P[j] || 0) / 100 * (K[j] || 0) - 1));
      const label = best === 1 ? `${fx.h}-${fx.a} 무` : `${best === 0 ? fx.h : fx.a} 승`;
      const mk = (fx.odds && fx.odds.O) || ((autoOdds(fx) || {}).O) || null;
      const meta = { f: fx.id, o: best, t: Date.now(), k: fx.ts || 0, l: fx.lg };
      if (mk && mk[best] > 1 && !fx.done && fx.state === 'pre') meta.m = mk[best];
      entrySheet({ d: todayStr(), picks: [[label, K[best], meta]], stake: 10000, res: 'P' });
      break;
    }
    case 'combo-add': if (S.combo.picks.length < 10) { S.combo.picks.push({ label: '', k: '' }); DB.set('combo', S.combo); render(); } break;
    case 'combo-del': if (S.combo.picks.length > 1) { S.combo.picks.splice(+el.dataset.i, 1); DB.set('combo', S.combo); render(); } break;
    case 'j-new': entrySheet({ d: todayStr(), picks: [['', null], ['', null]], stake: 10000, res: 'P' }); break;
    case 'j-open': { const en = S.journal.find(x => x.id === el.dataset.id); if (en) entrySheet(en); break; }
    case 'pick-add': { const box = $('#j-picks'); if (box.children.length < 10) box.insertAdjacentHTML('beforeend', pickRow('', null, box.children.length)); break; }
    case 'pick-del': { if ($('#j-picks').children.length > 1) el.closest('.combo-row').remove(); updateEntrySum(); break; }
    case 'j-res': S.sh.res = el.dataset.v; $$('[data-act="j-res"]').forEach(b => b.classList.toggle('on', b === el)); break;
    case 'j-save': {
      const picks = readPicks(), stake = toNum($('#j-stake').value), d = $('#j-d').value || todayStr();
      if (!picks.length || !stake) { toast('선택·배당·금액을 넣어 주세요'); break; }
      const rec = { id: S.sh.id || 'j' + Date.now(), d, picks, stake: Math.round(stake), res: S.sh.res };
      const idx = S.journal.findIndex(x => x.id === rec.id);
      if (idx >= 0) S.journal[idx] = rec; else S.journal.push(rec);
      saveJournal();
      const fromMatch = S.view === 'match';
      $('#sheets').innerHTML = ''; S.sh = null;
      if (sheetPushed) { sheetPushed = false; popThen(1, fromMatch ? () => { history.replaceState({ tab: 1 }, ''); tabPushed = true; } : null); }
      S.view = 'journal'; render(); window.scrollTo(0, 0); toast('일지에 기록했어요');
      break;
    }
    case 'j-del': S.journal = S.journal.filter(x => x.id !== S.sh.id); saveJournal(); closeSheet(); render(); toast('지웠어요'); break;
    case 'limit-edit':
      S.sh = { type: 'limit' };
      openSheet(`<div class="sh-head"><h2>한 달 한도</h2><button type="button" class="x" data-act="sheet-close" aria-label="닫기">×</button></div><div class="sh-body"><p class="sub">한 달에 쓸 최대 금액을 정해 두면, 넘었을 때 빨간색으로 알려줘요.</p><label class="field">한도(원)<input inputmode="numeric" id="lim" value="${S.set.limit}"></label></div><div class="sh-foot"><button type="button" class="btn" data-act="sheet-close">취소</button><button type="button" class="btn pri" data-act="limit-save">저장</button></div>`);
      break;
    case 'limit-save': { const v = toNum($('#lim').value); if (v > 0) { S.set.limit = Math.round(v); saveSet(); closeSheet(); render(); } break; }
    case 'bk-share': shareBackup(); break;
    case 'bk-file': downloadBackup(); break;
    case 'bk-copy': copyBackup(); break;
    case 'imp-file': $('#file-in').click(); break;
    case 'imp-paste': { const d = parseBackup($('#imp-text').value); if (!d) { toast('백업 글이 아니에요. 전체를 붙여넣어 주세요'); break; } importSheet(d); break; }
    case 'import-go': { applyBackup(S.sh.data); closeSheet(); render(); toast('백업을 불러왔어요'); break; }
    case 'clear-cache': DB.keys().filter(k => /^(c:|geo:)/.test(k)).forEach(k => DB.del(k)); S.det = {}; toast('비웠어요. 다시 받아올게요'); closeSheet(); loadList(true); break;
    case 'install': if (S.installEvt) { S.installEvt.prompt(); S.installEvt.userChoice.finally(() => { S.installEvt = null; closeSheet(); }); } break;
    case 'sheet-close': closeSheet(); break;
  }
});
let noteT = {};
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.o) {
    const key = t.dataset.o, side = t.dataset.side, i = +t.dataset.i, v = toNum(t.value);
    if (key === 'calc') { S.calc[side][i] = v; DB.set('calc', S.calc); $('#out-calc').innerHTML = oddsOut(S.calc.K, S.calc.O); return; }
    const fx = fxById(key); if (!fx) return;
    const b = getBet(key);
    if (side === 'K') b.K[i] = v;
    else { if (!b.O) b.O = (effO(fx) || [null, null, null]).slice(); b.O[i] = v; }
    setBet(key, b);
    $('#out-' + key).innerHTML = oddsOut(b.K, effO(fx) || b.O);
    $('#o-src').innerHTML = oSrcLabel(fx);
    $('#mine-out').innerHTML = mineOut(key);
  } else if (t.dataset.mine) {
    const fx = fxById(t.dataset.mine); if (!fx) return;
    const m = $$(`[data-mine="${fx.id}"]`).map(inp => { const n = toNum(inp.value); return n == null ? null : Math.max(0, Math.min(100, Math.round(n))); });
    DB.set('mine:' + fx.id, m);
    $('#mine-out').innerHTML = mineOut(fx.id);
  } else if (t.dataset.note != null) {
    const id = t.dataset.note; clearTimeout(noteT[id]);
    noteT[id] = setTimeout(() => DB.set('note:' + id, t.value), 400);
  } else if (t.dataset.ci != null) {
    S.combo.picks[+t.dataset.ci][t.dataset.f] = t.value; DB.set('combo', S.combo);
    $('#combo-out').innerHTML = comboOut();
  } else if (t.id === 'combo-pay' || t.id === 'set-pay') {
    S.set.pay = t.value; saveSet(); const co = $('#combo-out'); if (co) co.innerHTML = comboOut();
  } else if (t.id === 'set-limit') {
    const v = toNum(t.value); if (v > 0) { S.set.limit = Math.round(v); saveSet(); }
  } else if (t.closest && t.closest('#sheets') && (t.dataset.pk != null || t.dataset.pl != null || t.id === 'j-stake')) updateEntrySum();
});
document.addEventListener('change', e => {
  if (e.target.id !== 'file-in') return;
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  f.text().then(text => { const d = parseBackup(text); if (!d) { toast('축구 노트 백업 파일이 아니에요'); return; } importSheet(d); });
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; });
window.addEventListener('appinstalled', () => { S.installEvt = null; toast('앱으로 설치됐어요'); });
window.addEventListener('online', () => { if (S.view === 'matches' && S.fxState !== 'loading') loadList(false); });

/* the host's corner badge sits on top of the 전술판·일지 tabs: keep it hidden even if it is added later */
(function hideHostBadge() {
  const hide = () => document.querySelectorAll('[id^="nl-badge"]').forEach(el => { el.style.setProperty('display', 'none', 'important'); el.style.setProperty('pointer-events', 'none', 'important'); });
  hide();
  try { const mo = new MutationObserver(hide); mo.observe(document.documentElement, { childList: true }); mo.observe(document.body, { childList: true }); } catch (e) { }
})();

/* closing odds for CLV: picks that kick off within 3 hours → fetch their league list again (at most every 10 minutes) */
function closeWatch() {
  const now = Date.now(), lgs = new Set();
  S.journal.forEach(e => e.picks.forEach(p => { const m = p[2]; if (m && m.f && m.l && m.k > now && m.k - now < 3 * 36e5) lgs.add(m.l); }));
  lgs.forEach(lg => {
    const c = DB.get('c:fx2:' + lg + ':' + todayStr()); if (c && now - c.t < 10 * 6e4) return;
    loadFixtures(lg, true).then(list => { const cc = DB.get('c:fx2:' + lg + ':' + todayStr()); snapOdds(list, cc && cc.t); if (lg === S.lg) S.fixtures = list; if (S.view === 'journal') render(); }).catch(() => { });
  });
}
/* while a match is on: refresh by itself every minute (only when the app is on screen and nothing is being typed) */
setInterval(() => {
  if (document.visibilityState === 'visible' && navigator.onLine !== false) closeWatch();
  if (document.visibilityState !== 'visible' || navigator.onLine === false || $('#sheets').innerHTML) return;
  const ae = document.activeElement; if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  if (S.view === 'matches') { if (S.fxState !== 'loading' && S.fixtures.some(liveWindow)) loadList(false); }
  else if (S.view === 'match') { const fx = fxById(S.fid); if (liveWindow(fx)) loadDetail(fx, false); }
  else if (S.view === 'board' && TB.lu && TB.lu.ok && !TB.busy) { const fx = boardFx(); if (fx && liveWindow(fx)) fetchLineupToBoard(fx, false, false, 'auto'); }
}, 60000);

/* ================= start ================= */
(async function init() {
  await DB.open();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  Object.assign(S.set, DB.get('set', {}));
  S.lg = LEAGUES.some(l => l.s === S.set.lg) ? S.set.lg : 'eng.1';
  S.journal = DB.get('journal', []);
  const c = DB.get('calc'); if (c && Array.isArray(c.K) && Array.isArray(c.O)) S.calc = c;
  const cb = DB.get('combo'); if (cb && Array.isArray(cb.picks) && cb.picks.length) S.combo = cb;
  initBoardState();
  /* drop downloaded data older than 45 days */
  /* pre-match odds from fixture lists already on the phone (oldest first, so the latest wins), then drop old data */
  DB.keys().filter(k => k.startsWith('c:fx2:')).sort().forEach(k => { const v = DB.get(k); if (v && Array.isArray(v.v)) snapOdds(v.v, v.t); });
  DB.keys().filter(k => k.startsWith('c:')).forEach(k => { const v = DB.get(k); if (!v || Date.now() - v.t > 45 * 864e5 || k.startsWith('c:sh:')) DB.del(k); });   /* c:sh: = old shot lists that let defending actions in */
  DB.keys().filter(k => k.startsWith('od:')).forEach(k => { const v = DB.get(k); if (!v || Date.now() - v.t > 200 * 864e5) DB.del(k); });
  history.replaceState({ base: 1 }, '');
  render();
  loadList(false);
  closeWatch();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
